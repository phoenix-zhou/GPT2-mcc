[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clearcare-evidence-agent"
version = "0.1.0"
description = "Local-first, evidence-grounded health AI agent research demo"
requires-python = ">=3.10"
dependencies = [
    "bleach>=6.2,<7",
    "Flask>=3.0,<4",
    "Markdown>=3.7,<4",
]

[project.optional-dependencies]
inference = [
    "mlx-lm>=0.31,<0.32",
]
legacy-inference = [
    "torch>=2.2,<3",
    "transformers>=4.40,<5",
]
openai = ["openai>=1.66,<3"]
training = [
    "numpy>=1.26",
    "torch>=2.2,<3",
    "tqdm>=4.66",
    "transformers>=4.40,<5",
]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["evaluation"]
py-modules = [
    "app",
    "agent_runtime",
    "flask_predict",
    "functions_tools",
    "parameter_config",
    "pytorch_tools",
    "chat_models",
    "conversation",
    "settings",
    "knowledge",
    "safety",
]
